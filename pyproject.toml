[project]
name = "contactor"
version = "0.1.0"
description = "本机 agent 之间的 A2A 互操作桥"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27",
                "httpx-sse>=0.4", "pydantic>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
contactor = "contactor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
